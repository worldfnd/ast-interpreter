[package]
name = "ast-interpreter"
version.workspace = true
edition.workspace = true

[dependencies]
# Core Noir crates. They are pinned once below because `FieldElement` is compile-time global state.
acvm.workspace = true
noirc_abi.workspace = true
noirc_errors.workspace = true
noirc_frontend.workspace = true

# `DiffValue` serializes `BigInt` payloads in dump JSON.
num-bigint = { version = "0.4", features = ["serde"] }
num-traits = { version = "0.2" }
serde = { workspace = true }

# Optional integration oracle. Restore this dependency and feature forwarding when a matching branch
# is available.
# mavros-compiler = { git = "https://github.com/reilabs/mavros", branch = "<mavros-goldilocks-branch>", default-features = false, optional = true }

[dev-dependencies]
# Test package loading through stock Noir.
nargo_toml.workspace = true
fm.workspace = true
nargo.workspace = true
noirc_driver.workspace = true
# Executor oracle used by tests.
noirc_artifacts.workspace = true
bn254_blackbox_solver.workspace = true
serde_json = { version = "1.0" }
tempfile.workspace = true
# Randomized value-semantics tests.
proptest = "1"

[features]
# Build the pinned Noir stack with Goldilocks.
goldilocks = [
    "noirc_frontend/goldilocks",
    "noirc_driver/goldilocks",
]

# Optional integration oracle. Empty while the dependency above is disabled.
mavros-oracle = []

[lints]
workspace = true

# Single-crate workspace. Noir crates are pinned once so all `FieldElement` users share one source.
[workspace]

[workspace.package]
version = "0.1.0"
authors = ["Reilabs"]
categories = ["compilers", "cryptography"]
edition = "2024"
keywords = ["cryptography", "spartan", "zero-knowledge"]
license = "Apache-2.0"
repository = "https://github.com/worldfnd/ast-interpreter"

[workspace.dependencies]
# The Noir crates, pinned to a single git revision so the interpreter and the compiler cannot drift
# onto mismatched sources (the compiled-in field is a global).
acvm = { git = "https://github.com/worldfnd/noir.git", branch = "ys/goldilocks-port", package = "acvm" }
bn254_blackbox_solver = { git = "https://github.com/worldfnd/noir.git", branch = "ys/goldilocks-port", package = "bn254_blackbox_solver", default-features = false }
fm = { git = "https://github.com/worldfnd/noir.git", branch = "ys/goldilocks-port", package = "fm" }
nargo = { git = "https://github.com/worldfnd/noir.git", branch = "ys/goldilocks-port", package = "nargo" }
nargo_toml = { git = "https://github.com/worldfnd/noir.git", branch = "ys/goldilocks-port", package = "nargo_toml" }
noirc_abi = { git = "https://github.com/worldfnd/noir.git", branch = "ys/goldilocks-port", package = "noirc_abi" }
noirc_artifacts = { git = "https://github.com/worldfnd/noir.git", branch = "ys/goldilocks-port", package = "noirc_artifacts" }
noirc_driver = { git = "https://github.com/worldfnd/noir.git", branch = "ys/goldilocks-port", package = "noirc_driver" }
noirc_errors = { git = "https://github.com/worldfnd/noir.git", branch = "ys/goldilocks-port", package = "noirc_errors" }
noirc_frontend = { git = "https://github.com/worldfnd/noir.git", branch = "ys/goldilocks-port", package = "noirc_frontend" }

# Shared crates.
serde = { version = "1.0.204", features = ["derive"] }
tempfile = { version = "3.19.1" }

[profile.release]
debug = true
opt-level = "z"
lto = true

# These should be inherited in workspace packages using `[lints] workspace = true`
[workspace.lints.clippy]
# Allow all except performance and correctness by default.
all = { level = "allow", priority = -1 }
cargo = { level = "allow", priority = -1 }
complexity = { level = "allow", priority = -1 }
nursery = { level = "allow", priority = -1 }
pedantic = { level = "allow", priority = -1 }
restriction = { level = "allow", priority = -1 }
style = { level = "allow", priority = -1 }
suspicious = { level = "allow", priority = -1 }

# Then we turn on the ones we care about, focusing on reducing needlessly silly code.
cast_slice_from_raw_parts = "deny"
clone_on_copy = "deny"
crosspointer_transmute = "deny"
drop_non_drop = "deny"
expect_fun_call = "deny"
for_kv_map = "deny"
from_raw_with_void_ptr = "deny"
let_and_return = "deny"
let_underscore_future = "deny"
multi_assignments = "deny"
needless_borrows_for_generic_args = "deny"
needless_return = "deny"
octal_escapes = "deny"
only_used_in_recursion = "deny"
ptr_offset_with_cast = "deny"
redundant_closure = "deny"
single_match = "deny"
size_of_ref = "deny"
to_string_in_format_args = "deny"
unconditional_recursion = "deny"
unnecessary_cast = "deny"
useless_conversion = "deny"
