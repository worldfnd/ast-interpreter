[package]
name = "ast-interpreter"
version.workspace = true
edition.workspace = true

[dependencies]
# Core Noir crates. They are pinned once below because `FieldElement` is compile-time global state.
acvm.workspace = true
noirc_abi.workspace = true
noirc_errors.workspace = true
noirc_frontend.workspace = true
noirc_printable_type.workspace = true

# bn254's curve, Pedersen-generator and Poseidon2 black boxes.
bn254_blackbox_solver = { workspace = true, optional = true }
# `DiffValue` serializes `BigInt` payloads in dump JSON.
num-bigint = { version = "0.5", features = ["serde"] }
num-traits = { version = "0.2" }
serde = { workspace = true }
serde_json = { version = "1.0" }
sha2 = "0.10"

# Mavros oracle, commented out because Cargo reads a path dependency's manifest even with its
# feature off and CI has no Mavros checkout. `src/mavros_oracle.rs` has the steps to enable it.
# mavros-compiler = { path = "../mavros/compiler", optional = true }

[dev-dependencies]
# Test package loading through stock Noir.
nargo_toml.workspace = true
fm.workspace = true
nargo.workspace = true
noirc_driver.workspace = true
# Executor oracle used by tests.
noirc_artifacts.workspace = true
tempfile.workspace = true
# Randomized value-semantics tests.
proptest = "1"

[features]
default = ["bn254-crypto"]

# Route the embedded-curve, Pedersen-generator and Poseidon2 built-ins to `bn254_blackbox_solver`.
bn254-crypto = ["dep:bn254_blackbox_solver"]

# Becomes ["dep:mavros-compiler"] once that dependency is un-commented.
mavros-oracle = []

[lints]
workspace = true

# Single-crate workspace. Noir crates are pinned once so all `FieldElement` users share one source.
[workspace]

[workspace.package]
version = "0.1.0"
authors = ["Reilabs"]
categories = ["compilers", "cryptography"]
edition = "2024"
keywords = ["cryptography", "spartan", "zero-knowledge"]
license = "Apache-2.0"
repository = "https://github.com/worldfnd/ast-interpreter"

[workspace.dependencies]
# Pin all Noir crates together so they share AST types and the linked `FieldElement`.
acvm = { git = "https://github.com/worldfnd/noir.git", rev = "59467ac7c66cc27dcf70edc22a9d8b655a9fdf76", package = "acvm" }
bn254_blackbox_solver = { git = "https://github.com/worldfnd/noir.git", rev = "59467ac7c66cc27dcf70edc22a9d8b655a9fdf76", package = "bn254_blackbox_solver", default-features = false }
fm = { git = "https://github.com/worldfnd/noir.git", rev = "59467ac7c66cc27dcf70edc22a9d8b655a9fdf76", package = "fm" }
nargo = { git = "https://github.com/worldfnd/noir.git", rev = "59467ac7c66cc27dcf70edc22a9d8b655a9fdf76", package = "nargo" }
nargo_toml = { git = "https://github.com/worldfnd/noir.git", rev = "59467ac7c66cc27dcf70edc22a9d8b655a9fdf76", package = "nargo_toml" }
noirc_abi = { git = "https://github.com/worldfnd/noir.git", rev = "59467ac7c66cc27dcf70edc22a9d8b655a9fdf76", package = "noirc_abi" }
noirc_artifacts = { git = "https://github.com/worldfnd/noir.git", rev = "59467ac7c66cc27dcf70edc22a9d8b655a9fdf76", package = "noirc_artifacts" }
noirc_driver = { git = "https://github.com/worldfnd/noir.git", rev = "59467ac7c66cc27dcf70edc22a9d8b655a9fdf76", package = "noirc_driver" }
noirc_errors = { git = "https://github.com/worldfnd/noir.git", rev = "59467ac7c66cc27dcf70edc22a9d8b655a9fdf76", package = "noirc_errors" }
noirc_frontend = { git = "https://github.com/worldfnd/noir.git", rev = "59467ac7c66cc27dcf70edc22a9d8b655a9fdf76", package = "noirc_frontend" }
noirc_printable_type = { git = "https://github.com/worldfnd/noir.git", rev = "59467ac7c66cc27dcf70edc22a9d8b655a9fdf76", package = "noirc_printable_type" }

# Shared crates.
serde = { version = "1.0.204", features = ["derive"] }
tempfile = { version = "3.19.1" }

# Keep clippy defaults (correctness denied, perf/suspicious warned); only silence the two noisiest
# groups so real bugs still surface.
[workspace.lints.clippy]
style = { level = "allow", priority = -1 }
complexity = { level = "allow", priority = -1 }
