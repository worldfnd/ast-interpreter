[package]
name = "ast-interpreter"
version.workspace = true
edition.workspace = true

[dependencies]
# Core Noir crates. They are pinned once below because `FieldElement` is compile-time global state.
acvm.workspace = true
noirc_abi.workspace = true
noirc_errors.workspace = true
noirc_frontend.workspace = true
noirc_printable_type.workspace = true

# bn254's curve, Pedersen-generator and Poseidon2 black boxes.
bn254_blackbox_solver = { workspace = true, optional = true }
# `DiffValue` serializes `BigInt` payloads in dump JSON.
num-bigint = { version = "0.5", features = ["serde"] }
num-traits = { version = "0.2" }
serde = { workspace = true }
serde_json = { version = "1.0" }
sha2 = "0.10"

# Optional integration oracle: a Mavros checkout whose Noir crates are pinned to the same revision as
# the ones above, so both halves share one `FieldElement` and one monomorphized AST.
mavros-compiler = { path = "../mavros/compiler", optional = true }

[dev-dependencies]
# Test package loading through stock Noir.
nargo_toml.workspace = true
fm.workspace = true
nargo.workspace = true
noirc_driver.workspace = true
# Executor oracle used by tests.
noirc_artifacts.workspace = true
tempfile.workspace = true
# Randomized value-semantics tests.
proptest = "1"

[features]
default = ["bn254-crypto"]

# Route the embedded-curve, Pedersen-generator and Poseidon2 built-ins to `bn254_blackbox_solver`.
bn254-crypto = ["dep:bn254_blackbox_solver"]

# Integration oracle against the Mavros compiler.
mavros-oracle = ["dep:mavros-compiler"]

[lints]
workspace = true

# Single-crate workspace. Noir crates are pinned once so all `FieldElement` users share one source.
[workspace]

[workspace.package]
version = "0.1.0"
authors = ["Reilabs"]
categories = ["compilers", "cryptography"]
edition = "2024"
keywords = ["cryptography", "spartan", "zero-knowledge"]
license = "Apache-2.0"
repository = "https://github.com/worldfnd/ast-interpreter"

[workspace.dependencies]
# Pin all Noir crates together so they share AST types and the linked `FieldElement`.
acvm = { git = "https://github.com/worldfnd/noir.git", rev = "225db3e18f0ffaeeb3919a668f78b9e9c867b41f", package = "acvm" }
bn254_blackbox_solver = { git = "https://github.com/worldfnd/noir.git", rev = "225db3e18f0ffaeeb3919a668f78b9e9c867b41f", package = "bn254_blackbox_solver", default-features = false }
fm = { git = "https://github.com/worldfnd/noir.git", rev = "225db3e18f0ffaeeb3919a668f78b9e9c867b41f", package = "fm" }
nargo = { git = "https://github.com/worldfnd/noir.git", rev = "225db3e18f0ffaeeb3919a668f78b9e9c867b41f", package = "nargo" }
nargo_toml = { git = "https://github.com/worldfnd/noir.git", rev = "225db3e18f0ffaeeb3919a668f78b9e9c867b41f", package = "nargo_toml" }
noirc_abi = { git = "https://github.com/worldfnd/noir.git", rev = "225db3e18f0ffaeeb3919a668f78b9e9c867b41f", package = "noirc_abi" }
noirc_artifacts = { git = "https://github.com/worldfnd/noir.git", rev = "225db3e18f0ffaeeb3919a668f78b9e9c867b41f", package = "noirc_artifacts" }
noirc_driver = { git = "https://github.com/worldfnd/noir.git", rev = "225db3e18f0ffaeeb3919a668f78b9e9c867b41f", package = "noirc_driver" }
noirc_errors = { git = "https://github.com/worldfnd/noir.git", rev = "225db3e18f0ffaeeb3919a668f78b9e9c867b41f", package = "noirc_errors" }
noirc_frontend = { git = "https://github.com/worldfnd/noir.git", rev = "225db3e18f0ffaeeb3919a668f78b9e9c867b41f", package = "noirc_frontend" }
noirc_printable_type = { git = "https://github.com/worldfnd/noir.git", rev = "225db3e18f0ffaeeb3919a668f78b9e9c867b41f", package = "noirc_printable_type" }

# Shared crates.
serde = { version = "1.0.204", features = ["derive"] }
tempfile = { version = "3.19.1" }

# Keep clippy defaults (correctness denied, perf/suspicious warned); only silence the two noisiest
# groups so real bugs still surface.
[workspace.lints.clippy]
style = { level = "allow", priority = -1 }
complexity = { level = "allow", priority = -1 }

# LOCAL ONLY: build against the uncommitted noir checkout next door instead of the pinned
# revision, so `--generic-builtins` and the entry-point rule are visible before they are pushed.
# Mavros's own noir dependencies are patched by the same table when it is built in this workspace.
[patch."https://github.com/worldfnd/noir.git"]
acvm = { path = "../noir/acvm-repo/acvm" }
bn254_blackbox_solver = { path = "../noir/acvm-repo/bn254_blackbox_solver" }
fm = { path = "../noir/compiler/fm" }
nargo = { path = "../noir/tooling/nargo" }
nargo_toml = { path = "../noir/tooling/nargo_toml" }
noirc_abi = { path = "../noir/tooling/noirc_abi" }
noirc_artifacts = { path = "../noir/tooling/noirc_artifacts" }
noirc_driver = { path = "../noir/compiler/noirc_driver" }
noirc_errors = { path = "../noir/compiler/noirc_errors" }
noirc_frontend = { path = "../noir/compiler/noirc_frontend" }
noirc_printable_type = { path = "../noir/compiler/noirc_printable_type" }
